<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mi Cine</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
:root{--bg:#141414;--red:#e50914;--txt:#fff;--mut:#a3a3a3;--card:#232323;--sheet:#181818}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior-y:none}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}
svg.i{width:22px;height:22px;fill:currentColor;flex:none}

/* ---------- pantallas de inicio ---------- */
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px)}
.logo{color:var(--red);font-weight:900;letter-spacing:.5px;font-size:24px;text-transform:uppercase;font-family:"Arial Black",Impact,sans-serif}
.screen .logo{font-size:40px;margin-bottom:28px}
.panel{width:100%;max-width:440px;background:#000a;border:1px solid #2a2a2a;border-radius:10px;padding:22px}
.panel h2{margin:0 0 6px;font-size:22px}
.panel p{color:var(--mut);font-size:14px;line-height:1.45;margin:0 0 14px}
.panel label{display:block;font-size:13px;color:#ddd;margin:14px 0 6px}
.panel input{width:100%;background:#333;border:1px solid #444;border-radius:6px;color:#fff;padding:12px;font-size:15px}
.panel input:focus{outline:none;border-color:#888}
.origin{display:flex;gap:8px;align-items:center;background:#222;border-radius:6px;padding:8px 10px;font-size:13px;word-break:break-all}
.origin code{flex:1}
.big{width:100%;justify-content:center;margin-top:18px;padding:13px!important;font-size:16px!important}
.link{background:none;border:0;color:#ccc;text-decoration:underline;font-size:14px;margin-top:14px;padding:6px}
.err{color:#ff6b6b;font-size:13px;margin-top:10px;min-height:1em}

.who h1{font-weight:500;font-size:clamp(22px,6vw,40px);margin:0 0 28px}
.profiles{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;max-width:620px}
.prof{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;color:var(--mut)}
.prof .av{width:96px;height:96px;border-radius:8px;display:grid;place-items:center;font-size:40px;font-weight:800;color:#fff;border:3px solid transparent;transition:border-color .15s}
.prof:hover .av,.prof:focus .av{border-color:#fff}
.prof span{font-size:14px}
.prof.add .av{background:transparent;border:2px dashed #555;color:#777;font-size:44px;font-weight:300}
.who.manage .prof .av::after{content:"✎";position:absolute;font-size:30px}
.who.manage .prof:not(.add) .av{opacity:.55;position:relative}
.outline{background:none;border:1px solid #777;color:#aaa;padding:8px 22px;margin-top:34px;letter-spacing:2px;font-size:14px;text-transform:uppercase}

/* ---------- app ---------- */
header.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:linear-gradient(rgba(0,0,0,.8),transparent);transition:background .25s}
header.top.solid{background:rgba(20,20,20,.97)}
header.top .sp{flex:1}
.hbtn{background:none;border:0;padding:4px;display:grid;place-items:center}
.avatar{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
.desk-tabs{display:none;gap:18px;font-size:14px}
.desk-tabs button{background:none;border:0;color:#e5e5e5;padding:0}
.desk-tabs button.on{font-weight:700;color:#fff}
main{padding-bottom:calc(76px + env(safe-area-inset-bottom));min-height:100vh}

.hero{position:relative;height:74vh;min-height:440px;max-height:780px;overflow:hidden}
.hero .bgimg{position:absolute;inset:0;background-size:cover;background-position:center 20%}
.hero .trailer{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity 1.2s;pointer-events:none}
.hero .trailer.on{opacity:1}
.hero .trailer iframe{position:absolute;top:50%;left:50%;border:0;transform:translate(-50%,-50%)}
.hero .mute{position:absolute;right:16px;bottom:96px;z-index:2;width:40px;height:40px;border-radius:50%;border:1.5px solid #ddd;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .6s}
.hero .mute.on{opacity:1}
@media (min-width:900px){.hero .mute{right:4%;bottom:26%}}
.pminitxt{font-size:13px;font-weight:700;margin-left:4px}
@media (max-width:699px){.pminitxt{display:none}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 1%,rgba(20,20,20,.6) 32%,transparent 62%),linear-gradient(to bottom,rgba(0,0,0,.45),transparent 22%)}
.hero-content{position:absolute;left:0;right:0;bottom:22px;z-index:1;text-align:center;padding:0 20px}
.hero h1{font-size:clamp(30px,8vw,60px);line-height:1.02;margin:0 0 10px;text-shadow:0 2px 16px rgba(0,0,0,.7);font-weight:900;letter-spacing:-.5px}
.hero .rank{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:8px;text-shadow:0 1px 8px #000}
.t10{display:inline-grid;place-items:center;background:var(--red);border-radius:3px;width:26px;height:28px;font-size:8px;font-weight:900;line-height:1;text-align:center}
.t10 b{display:block;font-size:13px}
.tags{color:#e5e5e5;font-size:13px;margin-bottom:16px;text-shadow:0 1px 6px #000}
.tags span+span::before{content:"•";margin:0 7px;color:var(--red)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:6px;padding:10px 22px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn.play{background:#fff;color:#000}
.btn.play:active{background:#ccc}
.btn.sec{background:rgba(109,109,110,.72);color:#fff}
.btn.red{background:var(--red);color:#fff}

.row{margin:20px 0 4px;position:relative}
.row h2{font-size:18px;margin:0 16px 9px;font-weight:700}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px;scroll-snap-type:x proximity;scrollbar-width:none;scroll-padding:16px}
.scroller::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:min(29vw,170px);aspect-ratio:2/3;border-radius:6px;overflow:hidden;position:relative;background:var(--card);scroll-snap-align:start;cursor:pointer;transition:transform .2s}
.card:active{transform:scale(.97)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:10px;font-weight:800;font-size:15px;line-height:1.1;text-shadow:0 1px 4px #000a}
.ph::before{content:"";position:absolute;top:8px;left:9px;width:14px;height:14px;background:var(--red);clip-path:polygon(0 0,40% 0,40% 100%,0 100%,0 0,60% 0,100% 100%,60% 100%)}
.badge{position:absolute;bottom:0;left:50%;transform:translateX(-50%);background:var(--red);font-size:10px;font-weight:800;padding:3px 7px;border-radius:3px 3px 0 0;white-space:nowrap;z-index:2}
.cap{position:absolute;left:0;right:0;bottom:3px;padding:18px 6px 4px;font-size:11px;font-weight:700;background:linear-gradient(transparent,#000c);z-index:2}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.28);z-index:3}
.prog i{display:block;height:100%;background:var(--red)}
.t10corner{position:absolute;top:0;right:0;z-index:2}
.t10corner .t10{border-radius:0 0 0 3px;width:22px;height:25px;font-size:7px}
.t10corner .t10 b{font-size:11px}

/* ---------- Android TV / mando ---------- */
.tv :focus{outline:3px solid #fff;outline-offset:2px}
.tv .card:focus,.tv .item:focus .card{outline:3px solid #fff;outline-offset:0;transform:scale(1.07);z-index:5}
.tv .item:focus{outline:none}
.tv .ep:focus{outline:3px solid #fff;background:#2a2a2a}
.tv .prof:focus .av{border-color:#fff;transform:scale(1.08)}
.tv .prof:focus{outline:none}
.tv .btn:focus{outline:3px solid #fff;outline-offset:3px}
.tv .arr{display:none!important}
html:not(.srv) .srvonly{display:none!important}
html.srv .nosrv{display:none!important}
.av{overflow:hidden;position:relative}
.avatar{overflow:hidden;position:relative}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av .emo{font-size:52px;line-height:1}
.avatar .emo{font-size:18px}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0}
.avgrid button{aspect-ratio:1;border:2px solid transparent;border-radius:8px;font-size:26px;background:#333;display:grid;place-items:center;padding:0}
.avgrid button.on{border-color:#fff}
.avsvg{width:100%;height:100%;display:block}
.avgrid.chars{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.avgrid.chars button{overflow:hidden;background:none}
.avgrid.chars button:hover{transform:scale(1.06)}
.tv .avgrid button:focus{outline:3px solid #fff;transform:scale(1.08)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent}
.swatches button.on{border-color:#fff}
.menu-inner .avgrid button{display:grid;width:auto;padding:0;font-size:26px;text-align:center;justify-content:center}
.menu-inner .avgrid button.on{background:#555}
.menu-inner .swatches button{display:block;width:28px;height:28px;padding:0;flex:none}
.menu-inner .mini{display:inline-flex;width:auto;padding:7px 12px;font-size:13px;gap:6px}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(42vw,190px),1fr));gap:10px;padding:0 16px}
.ch{background:#222;border-radius:8px;overflow:hidden;cursor:pointer;position:relative;transition:transform .15s}
.ch:active{transform:scale(.97)}
.ch .lg{aspect-ratio:16/9;background:#2c2c2c;display:grid;place-items:center;font-weight:800;font-size:20px;color:#bbb}
.ch .lg img{max-width:72%;max-height:70%;object-fit:contain}
.ch .cn{padding:8px 10px 0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .np{padding:2px 10px 10px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.4em}
.ch .prog{position:static;height:3px}
/* TV en directo: lista con vista previa y guía */
.lvtop{display:flex;align-items:flex-end;gap:6px 18px;flex-wrap:wrap}
.lvtabs{display:flex;gap:4px;padding:0 12px 6px}
.lvtabs button{background:none;border:0;color:#999;font-weight:700;font-size:15px;padding:8px 10px;border-bottom:3px solid transparent}
.lvtabs button.on{color:#fff;border-color:var(--red)}
.lgt{font-size:11px;line-height:1.15;font-weight:800;text-align:center;padding:0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#ddd;text-transform:uppercase}
.pvlogo .lgt{font-size:clamp(20px,4vw,44px);color:#666}
.livebar{padding-bottom:12px!important}
.livebar #pBack{width:48px;height:48px}
#player:has(.livebar) video{height:calc(100% - 68px);margin-top:68px}
.badge-live{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:11px;padding:3px 7px;border-radius:3px;letter-spacing:.5px;margin-right:8px;line-height:1.2}
.lv{display:grid;grid-template-columns:minmax(300px,390px) 1fr;grid-template-areas:"side prev";gap:22px;padding:8px 16px 30px;align-items:start}
.lvside{grid-area:side;min-width:0}
.lvprev{grid-area:prev;position:sticky;top:calc(env(safe-area-inset-top) + 72px);min-width:0}
.lvsearch{display:flex;align-items:center;gap:8px;background:#222;border-radius:24px;padding:0 14px;margin-bottom:6px;color:#999}
.lvsearch input{flex:1;min-width:0;background:none;border:0;color:#fff;padding:11px 0;font-size:15px;outline:none}
.lvchips{padding:4px 0 10px!important}
.gtop~.lvchips{padding:2px 16px 10px!important}
.lvlist{display:flex;flex-direction:column;gap:6px}
.lvrow{display:flex;align-items:center;gap:12px;background:#181818;border-radius:8px;padding:8px;cursor:pointer;border:2px solid transparent;outline:none}
.lvrow:hover{background:#202020}
.lvrow.on{background:linear-gradient(90deg,#3d0b0e,#1b1b1b 75%);border-color:#e5091466}
.lvrow .lg,.gdl .lg{width:84px;height:48px;flex:none;background:#000;border:1px solid #333;border-radius:6px;display:grid;place-items:center;font-weight:800;color:#aaa;overflow:hidden;font-size:15px}
.lvrow .lg img,.gdl .lg img,.gch .lg img,.pvlogo img{max-width:80%;max-height:80%;object-fit:contain}
.lvrow .inf{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lvrow .inf b{font-size:14px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvrow .np{font-size:13px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvrow.on .np{color:#ff5a5f}
.lvrow .prog,.pvov .prog,.gdr .prog{position:static;height:3px;background:#444;border-radius:2px;max-width:230px;margin-top:3px}
.lvrow .fav{background:none;border:0;color:#777;font-size:22px;padding:4px 6px;line-height:1}
.fav.on,.pvbtns .btn.on{color:#f5c518!important}
.lvrow .pl{background:none;border:0;color:var(--red);padding:4px;display:none}
.lvrow .pl .i{width:26px;height:26px}
.lvrow.on .pl{display:block}
.pvbox{position:relative;aspect-ratio:16/9;background:radial-gradient(circle at 50% 42%,#2b2b2b,#090909 75%);border-radius:10px;overflow:hidden}
.pvbox video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .5s;background:#000}
.pvbox.playing video{opacity:1}
.pvlogo{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:800;color:#777}
.pvlogo img{max-width:32%;max-height:42%}
.pvmsg{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#999;font-size:13px}
.pvmsg .spin{margin:auto;width:22px;height:22px}
.pvov{padding:14px 2px 0}
.pvtag{display:flex;align-items:center;font-size:12px;color:#aaa;text-transform:uppercase;letter-spacing:.6px}
.pvov h2{font-size:30px;margin:8px 0 4px;font-weight:800}
.pvnow{display:flex;gap:10px;align-items:baseline;font-size:17px;flex-wrap:wrap}
.pvnow small{color:#aaa;font-size:13px}
.pvov .prog{height:4px;max-width:420px;margin:8px 0 2px}
.pvbtns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.pvup h3{font-size:12px;color:#999;text-transform:uppercase;letter-spacing:.6px;margin:14px 0 4px}
.pvup div{display:flex;gap:14px;padding:7px 0;border-top:1px solid #232323;font-size:14px}
.pvup b{color:#999;font-weight:600;min-width:44px}
.tv .lvrow:focus{border-color:#fff;background:#2a2a2a}
.gtop{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:6px 16px 8px;align-items:stretch}
.gdays{display:flex;gap:8px;align-items:stretch}
.gday{background:#1f1f1f;border:2px solid transparent;border-radius:10px;color:#ddd;min-width:66px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.gday small{font-size:11px;color:#999;font-weight:700}
.gday b{font-size:22px}
.gday.on{border-color:var(--red)}
.gday.on small,.gday.on b{color:var(--red)}
.gday.gnowb b{font-size:15px}
.gdet{background:#1a1a1a;border-radius:10px;padding:12px 16px;display:flex;gap:14px;align-items:center;min-height:86px;min-width:0}
.ghint{color:#888;font-size:14px}
.gdr{flex:1;min-width:0}
.gdm{font-size:12px;color:#aaa;display:flex;align-items:center;flex-wrap:wrap}
.gdr h3{margin:4px 0 2px;font-size:19px}
.gdr p{margin:5px 0 0;font-size:13px;color:#bbb;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gdet .btn{flex:none}
.gwrap{padding:0 0 0 16px}
.gscroll{overflow:auto;position:relative;border-top:1px solid #262626;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ginner{position:relative}
.ghead{position:sticky;top:0;z-index:5;display:flex;height:34px;background:#141414;border-bottom:1px solid #2a2a2a}
.gcorner{position:sticky;left:0;z-index:6;width:var(--chw);flex:none;background:#141414;color:#777;display:grid;place-items:center}
.gticks{position:relative;height:100%}
.gticks span{position:absolute;top:9px;font-size:12px;color:#aaa;padding-left:6px;border-left:1px solid #333;height:25px}
.gnowlbl{position:absolute;top:6px;transform:translateX(-50%);background:var(--red);color:#fff;font-size:11px;font-weight:800;font-style:normal;padding:2px 6px;border-radius:4px;z-index:2}
.grow{display:flex;height:66px;border-bottom:1px solid #1d1d1d}
.gch{position:sticky;left:0;z-index:3;width:var(--chw);flex:none;background:#141414;border:0;border-right:1px solid #2a2a2a;color:#fff;display:flex;align-items:center;gap:10px;padding:0 10px;text-align:left;cursor:pointer}
.gch:hover{background:#1e1e1e}
.gch .lg{width:48px;height:36px;flex:none;display:grid;place-items:center;background:#000;border-radius:5px;overflow:hidden;font-weight:800;font-size:12px;color:#999}
.gch .nm{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gtrack{position:relative;flex:1}
.gp{position:absolute;top:5px;bottom:5px;background:#252525;border:1px solid #333;border-radius:7px;color:#fff;text-align:left;padding:0;overflow:hidden;overflow:clip;cursor:pointer}
.gp span{position:sticky;left:calc(var(--chw) + 6px);display:inline-flex;flex-direction:column;max-width:100%;box-sizing:border-box;padding:8px 10px;gap:4px}
.gp b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp small{font-size:11px;color:#999;white-space:nowrap}
.gp.past{opacity:.45}
.gp.cur{background:#2c2c2c;border-color:var(--red)}
.gp:hover{background:#333}
.gp.sel{background:#3a3a3a;outline:2px solid #fff;outline-offset:-2px}
.gp.none{background:#1a1a1a;border-style:dashed;color:#888}
.tv .gp:focus,.tv .gch:focus{outline:3px solid #fff;outline-offset:-3px;background:#3a3a3a}
.gnowline{position:absolute;top:34px;bottom:0;width:2px;background:var(--red);z-index:2;pointer-events:none}
@media (max-width:899px){
  .lv{grid-template-columns:1fr;grid-template-areas:"prev" "side";padding:2px 12px 96px;gap:8px}
  .lvprev{position:sticky;top:calc(env(safe-area-inset-top) + 54px);z-index:6;background:var(--bg);padding-bottom:6px}
  .pvbox{max-height:30vh;aspect-ratio:auto;height:min(30vh,calc((100vw - 24px) * .5625))}
  .pvov{padding-top:8px}
  .pvtag,.pvup,#pvToggle,.pvov .prog{display:none}
  .pvov h2{font-size:19px;margin:0 0 2px}
  .pvnow{font-size:14px}
  .pvbtns{margin:8px 0 0}
  .pvbtns .btn{padding:7px 14px;font-size:14px}
  .lvrow .lg{width:64px;height:40px}
  .gtop{grid-template-columns:1fr;padding:4px 12px 6px}
  .gday{min-width:56px;padding:6px 8px}
  .gday b{font-size:18px}
  .gwrap{padding:0}
  .grow{height:60px}
  .gch{flex-direction:column;justify-content:center;gap:3px;padding:0 4px}
  .gch .lg{width:44px;height:28px}
  .gch .nm{font-size:10px;text-align:center;-webkit-line-clamp:1;max-width:100%}
  .gdet{min-height:0;padding:10px 12px;flex-wrap:wrap}
  .gdl{display:none}
}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}
.rqrow{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid #222}
.rqrow img,.rqrow .noimg{width:54px;aspect-ratio:2/3;border-radius:4px;object-fit:cover;background:#333;flex:none}
.rqrow .tx{flex:1;min-width:0}
.rqrow .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rqrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* IndexedDB: guarda la biblioteca sin el límite de 5 MB de localStorage */
const DB = {
  db: null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open('mi-cine', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(this.db = r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  },
  async get(k, d){
    try { const db = await this.open(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result ?? d); q.onerror = () => rej(q.error); }); }
    catch { return LS.get(k, d); }
  },
  async set(k, v){
    try { const db = await this.open(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
    catch { LS.set(k, v); }
  }
};

async function boot(){
  importHashConfig();
  S.cfg = Object.assign({}, window.MI_CINE_CONFIG || {}, LS.get('cfg', {}));
  const qs = new URLSearchParams(location.search);
  if (window.FORCE_DEMO || qs.has('demo')) return startDemo();
  if (window.MI_CINE_SERVER) return serverBoot();
  if (!S.cfg.googleClientId || !S.cfg.tmdbKey) return showSetup();
  registerSW();
  const t = sessionStorage.getItem('mc_token');
  if (t) { try { const o = JSON.parse(t); if (o.exp > Date.now() + 60e3) { S.token = o.token; S.tokenExp = o.exp; } } catch {} }
  S.stats = LS.get('stats', null) || newStats();
  // biblioteca guardada (con migración desde la versión anterior)
  S.files = await DB.get('files', null) || LS.get('files', []);
  S.meta = await DB.get('meta', null) || LS.get('meta', {});
  S.folders = await DB.get('folders', {});
  LS.del('files'); LS.del('meta');
  showWho();
}

function importHashConfig(){
  const m = location.hash.match(/^#cfg=(.+)$/);
  if (!m) return;
  try {
    const cfg = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    LS.set('cfg', cfg);
    toast('Configuración importada ✔');
  } catch (e) { console.warn('cfg inválida', e); }
  history.replaceState(null, '', location.pathname + location.search);
}

function show(id){
  for (const s of ['setup','login','who','app']) $('#'+s).classList.toggle('hidden', s !== id);
  window.scrollTo(0, 0);
}

  LS.set('cfg', cfg);

function resizePhoto(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => {
      const S2 = 200, c = document.createElement('canvas'); c.width = c.height = S2;
      const s = Math.min(im.width, im.height);
      c.getContext('2d').drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, S2, S2);
      res(c.toDataURL('image/jpeg', 0.82));
    }; im.src = r.result; };
    r.readAsDataURL(file);
  });

function loadGIS(){
  if (window.google?.accounts?.oauth2) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar el login de Google'));
    document.head.appendChild(s);
  });
}
async function ensureToken(interactive, minLeftMs = 120e3){
  if (S.demo) return;
  if (S.token && S.tokenExp - Date.now() > minLeftMs) return;
  if (!interactive) throw new Error('auth');
  await loadGIS();
  return new Promise((resolve, reject) => {
    S.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: S.cfg.googleClientId,
      scope: SCOPES,
      callback: r => {
        if (r.error) return reject(new Error(r.error));
        if (!google.accounts.oauth2.hasGrantedAllScopes(r, ...SCOPES.split(' '))) return reject(new Error('scopes'));
        S.token = r.access_token;
        S.tokenExp = Date.now() + (r.expires_in - 30) * 1000;
        sessionStorage.setItem('mc_token', JSON.stringify({ token: S.token, exp: S.tokenExp }));
        LS.set('consented', true);
        resolve();
      },
      error_callback: e => reject(new Error(e?.type || 'popup'))
    });
    S.tokenClient.requestAccessToken({ prompt: LS.get('consented') ? '' : 'consent' });
  });
}
function authError(e){
  const m = String(e?.message || e);
  if (m.includes('popup')) return 'El navegador bloqueó la ventana de Google. Permite ventanas emergentes y vuelve a tocar.';
  if (m.includes('scopes')) return 'Hay que marcar todas las casillas de permisos en la ventana de Google.';
  if (m.includes('access_denied')) return 'Acceso denegado. ¿Añadiste tu correo como usuario de prueba en Google Cloud?';
  return 'No se pudo conectar con Google (' + m + ').';
}

async function gfetch(url, opts = {}){
  const r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + S.token } });
  if (r.status === 401) { S.token = null; sessionStorage.removeItem('mc_token'); throw new Error('auth'); }
  if (!r.ok) throw new Error('Drive ' + r.status);
  return opts.raw ? r : r.json();
}
async function driveList(q, fields, extra = ''){
  const out = []; let pageToken = '';
  do {
    const u = 'https://www.googleapis.com/drive/v3/files?pageSize=1000&q=' + encodeURIComponent(q) +
      '&fields=' + encodeURIComponent('nextPageToken,files(' + fields + ')') +
      '&includeItemsFromAllDrives=true&supportsAllDrives=true' + extra + (pageToken ? '&pageToken=' + pageToken : '');
    const r = await gfetch(u);
    out.push(...(r.files || [])); pageToken = r.nextPageToken || '';
  } while (pageToken);
  return out;
}
function folderId(v){
  if (!v) return '';
  const m = String(v).match(/folders\/([\w-]{10,})/) || String(v).match(/[?&]id=([\w-]{10,})/);
  return m ? m[1] : String(v).trim();
}
const VIDEO_FIELDS = 'id,name,mimeType,size,createdTime,parents,thumbnailLink,videoMediaMetadata(durationMillis)';
function toFile(v){
  if (/\bsample\b|\btrailer\b/i.test(v.name)) return null;
  if (v.size && +v.size < 15e6) return null;
  const root = folderId(S.cfg.driveFolder);
  const path = []; let p = v.parents?.[0], ok = !root, guard = 0;
  while (p && guard++ < 20) {
    if (p === root) { ok = true; break; }
    const f = S.folders[p]; if (!f) break;
    path.push(f[0]); p = f[1];
  }
  if (!ok) return null;
  return { id: v.id, n: v.name, m: v.mimeType, s: +v.size || 0, c: v.createdTime, th: v.thumbnailLink || '', d: +(v.videoMediaMetadata?.durationMillis || 0), p: path.slice(0, 4) };
}
/* full = recorre todo Drive (detecta borrados). Si no, solo pide lo creado desde la última vez. */
async function scanDrive(full){
  const startedAt = new Date(Date.now() - 5 * 60e3).toISOString(); // margen de 5 min
  const since = LS.get('lastScan', '');
  const newer = !full && since ? ` and createdTime > '${since}'` : '';
  const [folders, videos] = await Promise.all([
    driveList("mimeType='application/vnd.google-apps.folder' and trashed=false" + newer, 'id,name,parents'),
    driveList("mimeType contains 'video/' and trashed=false" + newer, VIDEO_FIELDS)
  ]);
  if (full) S.folders = {};
  for (const f of folders) S.folders[f.id] = [f.name, f.parents?.[0] || ''];
  const found = videos.map(toFile).filter(Boolean);
  let files, added;
  if (full) {
    const before = new Set(S.files.map(f => f.id));
    files = found; added = found.filter(f => !before.has(f.id)).length;
    LS.set('lastFull', Date.now());
  } else {
    const byId = Object.fromEntries(S.files.map(f => [f.id, f]));
    added = 0;
    for (const f of found) { if (!byId[f.id]) added++; byId[f.id] = f; }
    files = Object.values(byId);
  }
  LS.set('lastScan', startedAt);
  await DB.set('folders', S.folders);
  return { files, added, changed: full || added > 0 };
}

  if (S.demo || !S.token) return;
  try {
    const id = await findStatsFile(); if (!id) return;
    const remote = await gfetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
    S.stats = mergeStats(S.stats, remote);
    LS.set('stats', S.stats);
  } catch (e) { console.warn('stats', e); }
}
function mergeStats(a, b){
  if (!b?.profiles) return a; if (!a?.profiles?.length && !Object.keys(a?.data||{}).length) return b;
  const newer = (b.updated || 0) > (a.updated || 0) ? b : a, older = newer === a ? b : a;
  const out = JSON.parse(JSON.stringify(newer));
  for (const p of older.profiles) if (!out.profiles.some(x => x.id === p.id)) out.profiles.push(p);
  for (const [pid, d] of Object.entries(older.data || {})) {
    const o = out.data[pid] ||= { progress: {}, views: {}, list: [], last: {} };
    o.progress ||= {}; o.views ||= {}; o.last ||= {}; o.list ||= [];
    for (const [f, pr] of Object.entries(d.progress || {})) if (!o.progress[f] || o.progress[f].at < pr.at) o.progress[f] = pr;
    for (const [k, n] of Object.entries(d.views || {})) o.views[k] = Math.max(o.views[k] || 0, n);
    for (const [k, f] of Object.entries(d.last || {})) o.last[k] ||= f;
  }
  return out;
}

}

async function tmdb(path, params = {}){
  const u = new URL('https://api.themoviedb.org/3' + path);
  const key = S.cfg.tmdbKey || '';
  const bearer = key.startsWith('eyJ');
  if (!bearer) u.searchParams.set('api_key', key);
  u.searchParams.set('language', 'es-ES');
  for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== '') u.searchParams.set(k, v);
  const r = await fetch(u, bearer ? { headers: { Authorization: 'Bearer ' + key } } : {});
  if (r.status === 429) { await new Promise(r => setTimeout(r, 1500)); return tmdb(path, params); }
  if (!r.ok) throw new Error('TMDB ' + r.status);
  return r.json();
}

async function loadTrending(){

  const reqs = [tmdb('/trending/all/day'), ...[1,2,3,4,5].map(p => tmdb('/trending/all/week', { page: p })), tmdb('/movie/popular', { region: 'ES' }), tmdb('/tv/popular')];
  const res = await Promise.all(reqs.map(p => p.catch(() => ({ results: [] }))));
  const seen = new Set(), list = [];
  res.forEach((r, i) => {

function compact(x, type){
  return { id: x.id, t: x.title || x.name, p: x.poster_path || '', b: x.backdrop_path || '', o: x.overview || '', g: x.genre_ids || [], r: Math.round((x.vote_average || 0) * 10) / 10, v: x.vote_count || 0, d: x.release_date || x.first_air_date || '', pop: Math.round(x.popularity || 0), ty: type };
}
async function lookup(g){
  const key = g.k0;
  const cached = S.meta[key];
  if (cached && (!cached.miss || Date.now() - cached.miss < 7 * DAY)) return;
  let best = null;
  const tries = [];
  if (g.type === 'movie') {
    if (g.year) tries.push(['/search/movie', { query: g.title, year: g.year }]);
    tries.push(['/search/movie', { query: g.title }], ['/search/tv', { query: g.title }]);
  } else {
    if (g.year) tries.push(['/search/tv', { query: g.title, first_air_date_year: g.year }]);
    tries.push(['/search/tv', { query: g.title }], ['/search/multi', { query: g.title }]);
  }
  for (const [path, params] of tries) {
    try {
      const r = await tmdb(path, params);
      const hit = (r.results || []).find(x => path.endsWith('multi') ? (x.media_type === 'movie' || x.media_type === 'tv') : true);
      if (hit) { best = compact(hit, path.includes('movie') ? 'movie' : path.includes('/tv') ? 'tv' : hit.media_type); break; }
    } catch (e) { console.warn(e); }
  }
  S.meta[key] = best || { miss: Date.now() };
}
async function seasonInfo(tvId, n){
  const k = tvId + ':' + n;
  if (S.seasons[k]) return S.seasons[k];
  if (S.server) { try { return S.seasons[k] = await api(`season?tv=${tvId}&s=${n}`); } catch { return null; } }
  try { const r = await tmdb(`/tv/${tvId}/season/${n}`); S.seasons[k] = r; return r; } catch { return null; }

/* =========================================================
   Interpretar nombres de archivo
   ========================================================= */
const VEXT = /\.(mkv|mp4|m4v|avi|mov|wmv|webm|ts|m2ts|mpe?g|flv|3gp|ogv)$/i;
const JUNK = /\b(2160p|1080p|1080i|720p|576p|480p|4k|uhd|hdr10\+?|hdr|dolby ?vision|x26[45]|h ?26[45]|hevc|avc|xvid|divx|blu ?ray|bdrip|brrip|bdremux|remux|webrip|web ?dl|hdtv|hdrip|dvdrip|microhd|ac3|aac|dts(?: ?hd)?|ddp?5 ?1|truehd|atmos|10 ?bit|proper|repack|extended|unrated|directors cut|castellano|espanol|español|spanish|latino|dual|multi|subtitulad[oa]|subs|vose|esp|eng|screener|imax)\b/i;
const SEASON_DIR = /^(?:temporada|season|temp|serie|s|t)\s*0*(\d{1,2})$/i;
const GENERIC_DIR = /^(series|serie|tv|tv shows|peliculas|películas|pelis|movies|films|cine|videos|vídeos|media|multimedia|mi unidad|my drive|drive|descargas|downloads|anime|documentales)$/i;
function clean(s){ return s.replace(VEXT, '').replace(/[\[{]((?:19|20)\d{2})[\]}]/g, ' $1 ').replace(/\[[^\]]*\]|\{[^}]*\}/g, ' ').replace(/[._]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function tidy(s){
  const m = s.match(JUNK); if (m && m.index > 0) s = s.slice(0, m.index);
  return s.replace(/[(\[][^)\]]*$/, '').replace(/\(\s*\)/g, '').replace(/[\s\-–—:,.(+]+$/, '').replace(/^[\s\-–—]+/, '').trim();
}
function yearOf(s){
  const all = [...s.matchAll(/(?:^|[\s(\[])((?:19|20)\d{2})(?=$|[\s)\]])/g)].filter(m => m.index > 0 && +m[1] <= new Date().getFullYear() + 1);
  return all.length ? all[all.length - 1] : null;
}
function parseName(name, path = []){
  const base = clean(name);
  const dirs = path.map(clean);
  const seriesDir = dirs.find(d => !SEASON_DIR.test(d) && !GENERIC_DIR.test(d)) || '';
  const pats = [
    /^(.*?)\bS(\d{1,2}) ?E(\d{1,3})/i,
    /^(.*?)\b(\d{1,2})x(\d{1,3})\b/i,
    /^(.*?)\b(?:temporada|season|temp|t) ?(\d{1,2})\D{0,8}?(?:cap(?:itulo|ítulo)?|ep(?:isodio|isode)?|e) ?(\d{1,3})/i,
    /^(.*?)\bcap(?:itulo|ítulo)?\.? ?(\d)(\d{2})\b/i
  ];
  for (const re of pats) {
    const m = base.match(re);
    if (m) {
      let t = tidy(m[1]); let y = null;
      const ym = yearOf(t); if (ym) { y = +ym[1]; t = tidy(t.slice(0, ym.index)); }
      if (!t) t = tidy(seriesDir);
      return { type: 'tv', title: t || base, year: y, season: +m[2], episode: +m[3] };
    }
  }
  const sd = dirs.find(d => SEASON_DIR.test(d));
  if (sd) {
    const em = base.match(/(?:^|\D)(?:e|ep|episodio|episode|cap(?:itulo|ítulo)?)?[ .]?0*(\d{1,3})(?=\D|$)/i);
    if (em) return { type: 'tv', title: tidy(seriesDir) || 'Serie', year: null, season: +sd.match(SEASON_DIR)[1], episode: +em[1] };
  }
  const ym = yearOf(base);
  let title = ym ? base.slice(0, ym.index) : base;
  title = tidy(title) || tidy(base) || base;
  return { type: 'movie', title, year: ym ? +ym[1] : null };
}

/* =========================================================
   Construir la biblioteca
   ========================================================= */
function buildLibrary(){
  const groups = {};
  for (const f of S.files) {
    const info = parseName(f.n, f.p);
    const k0 = info.type + '|' + norm(info.title) + '|' + (info.type === 'movie' ? (info.year || '') : '');
    const g = groups[k0] ||= { k0, type: info.type, title: info.title, year: info.year, files: [] };
    if (!g.year && info.year) g.year = info.year;
    g.files.push({ ...f, season: info.season, episode: info.episode });
  }
  const items = {};
  for (const g of Object.values(groups)) {
    const m = S.meta[g.k0];
    const ok = m && !m.miss;
    const type = ok ? (m.ty || g.type) : g.type;
    const key = ok ? type + ':' + m.id : 'x:' + g.k0;
    const it = items[key] ||= {
      key, type, matched: ok, tmdbId: ok ? m.id : null,
      title: ok ? m.t : g.title, p: ok ? m.p : '', b: ok ? m.b : '', o: ok ? m.o : '',
      g: ok ? m.g : [], r: ok ? m.r : 0, v: ok ? m.v : 0, d: ok ? m.d : (g.year ? g.year + '-01-01' : ''),
      pop: ok ? m.pop : 0, files: [], added: 0, groups: []
    };
    it.groups.push(g);
    it.files.push(...g.files);
  }
  for (const it of Object.values(items)) {
    it.added = Math.max(...it.files.map(f => Date.parse(f.c) || 0));
    if (!it.matched && it.files.every(f => f.season)) it.type = 'tv';
    if (it.type === 'tv') {
      const byEp = {};
      for (const f of it.files) {
        const s = f.season || 1, e = f.episode || 0, k = s + 'x' + e;
        if (!byEp[k] || f.s > byEp[k].s) byEp[k] = { ...f, season: s, episode: e };
      }
      it.eps = Object.values(byEp).sort((a, b) => a.season - b.season || a.episode - b.episode);
      it.seasons = [...new Set(it.eps.map(e => e.season))];
      it.newestEp = Math.max(...it.eps.map(e => Date.parse(e.c) || 0));
    }
    if (it.type === 'movie') it.main = it.files.slice().sort((a, b) => b.s - a.s)[0];
  }
  S.byKey = items;
  setLib(Object.values(items).filter(it => it.matched), Object.values(items).filter(it => !it.matched).sort((a, b) => b.added - a.added));
}

let syncing = false;
async function enterApp(){
  applyKids();
  show('app');
  $('#myAvatar').style.background = S.profile.color;
  $('#myAvatar').innerHTML = avatarInner(S.profile);
  if (S.server) { setTab('home'); if (TV) setTimeout(() => { const b = $('#view .hero .btn.play') || $('#view .card'); b && focusEl(b); }, 150); return srvLoadLibrary(); }
  if (!S.demo) buildLibrary();
  setTab('home');
  if (S.demo) return;

}
async function sync(force){
  if (syncing) return; syncing = true;
  const first = !S.files.length;
  const full = force || first || Date.now() - LS.get('lastFull', 0) > FULL_SCAN_EVERY;
  if (first) toast('Leyendo tu Google Drive por primera vez…', true);
  else if (force) toast('Actualizando biblioteca…', true);
  try {
    await Promise.all([
      loadStatsRemote(),
      loadGenres().catch(e => console.warn(e)),
      loadTrending().catch(e => console.warn(e))
    ]);
    const before = S.items.length;
    const { files, added, changed } = await scanDrive(full);
    if (changed) {
      S.files = files; await DB.set('files', files);
      buildLibrary(); render();
    } else render(); // por si cambiaron las tendencias o las vistas
    const pending = Object.values(S.byKey).flatMap(it => it.groups).filter(g => { const m = S.meta[g.k0]; return !m || (m.miss && Date.now() - m.miss > 7 * DAY); });
    if (pending.length) {
      let done = 0;
      const loud = first || force || pending.length > 5;
      if (loud) toast(`Buscando carátulas: 0/${pending.length}`, true);
      await pool(pending, 6, async g => {
        await lookup(g); done++;
        if (done % 10 === 0) { if (loud) toast(`Buscando carátulas: ${done}/${pending.length}`, true); DB.set('meta', S.meta); }
        if (done % 40 === 0) { buildLibrary(); render(); }
      });
      await DB.set('meta', S.meta);
      buildLibrary(); render();
    }
    if (first || force) toast(`${S.items.length} títulos en tu biblioteca`);
    else if (added) { const n = Math.max(S.items.length - before, 0); toast(n ? `${n} título${n > 1 ? 's' : ''} nuevo${n > 1 ? 's' : ''} en tu biblioteca` : `${added} vídeo${added > 1 ? 's' : ''} nuevo${added > 1 ? 's' : ''}`); }
    else $('#toast').classList.add('hidden');
    if (!S.files.length) toast('No he encontrado vídeos en Drive. Revisa la carpeta en Ajustes.');
  } catch (e) {
    console.error(e);
    if (String(e.message).includes('auth')) toast('La sesión de Google ha caducado. Toca tu perfil para volver a entrar.');

async function pool(arr, n, fn){

}

function trendRank(){
  const rank = {}; S.trending.forEach((k, i) => rank[k] = i);
  return rank;
}
function top10(type){
  const rank = trendRank();
  const pool = S.items.filter(it => !type || it.type === type);
  const inTrend = pool.filter(it => rank[it.key] !== undefined).sort((a, b) => rank[a.key] - rank[b.key]);
  const rest = pool.filter(it => rank[it.key] === undefined).sort((a, b) => b.pop - a.pop);
  return [...inTrend, ...rest].slice(0, 10);
}
function houseViews(){
  const total = {};
  for (const d of Object.values(S.stats.data)) for (const [k, n] of Object.entries(d.views || {})) total[k] = (total[k] || 0) + n;
  return total;
}
function mostWatched(){
  const v = houseViews(); const ok = new Set(S.items);
  return Object.entries(v).sort((a, b) => b[1] - a[1]).map(([k]) => S.byKey[k]).filter(it => it && ok.has(it)).slice(0, 10);
}
function continueWatching(){
  const d = pdata(); const out = []; const seen = new Set();
  const entries = Object.entries(d.progress).sort((a, b) => b[1].at - a[1].at);
  for (const [fid, pr] of entries) {
    const it = S.byKey[pr.k]; if (!it || seen.has(it.key)) continue;
    const frac = pr.d ? pr.t / pr.d : 0;
    if (it.type === 'tv' && it.eps) {
      const idx = it.eps.findIndex(e => e.id === fid);
      if (idx < 0) continue;
      if (frac >= 0.92) { const nx = it.eps[idx + 1]; if (nx) { out.push({ it, file: nx, frac: 0 }); seen.add(it.key); } continue; }
      if (frac > 0.02) { out.push({ it, file: it.eps[idx], frac }); seen.add(it.key); }
    } else if (frac > 0.02 && frac < 0.92) { out.push({ it, file: it.main, frac }); seen.add(it.key); }
    if (out.length >= 15) break;
  }
  return out;
}
function recentReleases(type){
  const now = Date.now();
  return S.items.filter(it => (!type || it.type === type) && it.d && now - Date.parse(it.d) < 540 * DAY && Date.parse(it.d) <= now)
    .sort((a, b) => Date.parse(b.d) - Date.parse(a.d)).slice(0, 20);
}
function recentlyAdded(type){
  return S.items.filter(it => !type || it.type === type).sort((a, b) => (b.newestEp || b.added) - (a.newestEp || a.added)).slice(0, 20);
}
function topRated(type){

function genreRows(type, limit = 8){

  for (const it of S.items) if (!type || it.type === type) for (const g of it.g) count[g] = (count[g] || 0) + 1;
  return Object.entries(count).filter(([, n]) => n >= 3).sort((a, b) => b[1] - a[1]).slice(0, limit)
    .map(([g]) => ({ id: +g, name: genreName(+g), items: S.items.filter(it => (!type || it.type === type) && it.g.includes(+g)).sort((a, b) => b.pop - a.pop).slice(0, 25) }));
}

async function trailerKey(it){

  const yt = list.filter(v => v.site === 'YouTube');

  const hard = g.some(x => x === 27 || x === 53 || x === 80 || x === 10752 || x === 10768); // terror, suspense, crimen, bélica

let idleTimer = null;
async function play(key, fileId){

  const file = (it.eps || it.files).find(f => f.id === fileId) || it.main || it.files[0];

  const p = $('#player');
  const sub = it.type === 'tv' ? `T${file.season}:E${file.episode}` : '';
  p.innerHTML = `<div class="pbar"><button class="hbtn" id="pBack">${ICON.back}</button><div class="ttl">${esc(it.title)}<small>${sub}</small></div><span style="flex:1"></span>
    ${document.pictureInPictureEnabled ? `<button class="hbtn" id="pMini" title="Minimizar en ventana flotante" aria-label="Minimizar en ventana flotante" style="display:flex;align-items:center"><svg class="i" viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V5c0-1.1-.9-2-2-2H3C1.9 3 1 3.9 1 5v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg><span class="pminitxt">Minimizar</span></button>` : ''}</div>
    <video id="vid" controls playsinline preload="auto"></video>
    <button class="btn sec pswitch hidden" id="pSwitch">¿No se ve bien? Usar reproductor de Drive</button>
    <button class="btn play pnext hidden" id="pNext">${ICON.next}Siguiente episodio</button>`;
  if (p.classList.contains('hidden')) pushH('p');
  p.classList.remove('hidden', 'mini'); document.body.classList.add('lock');
  const v = $('#vid');
  const pr = pdata().progress[file.id];
  const resumeAt = pr && pr.d && pr.t / pr.d > 0.02 && pr.t / pr.d < 0.92 ? pr.t : 0;
  v.addEventListener('loadedmetadata', () => { if (resumeAt && !S.cur.started && !S.cur.tc) v.currentTime = resumeAt; }, { once: true });
  if (S.server) $('#pSwitch').textContent = '¿No se ve bien? Abrir en otro reproductor';
  v.addEventListener('playing', () => { S.cur.started = true; setTimeout(() => S.cur && !S.cur.iframe && $('#pSwitch')?.classList.remove('hidden'), 1500); setTimeout(() => $('#pSwitch')?.classList.add('hidden'), 12000); });
  v.addEventListener('timeupdate', onTime);
  v.addEventListener('ended', onEnded);
  v.addEventListener('error', onVideoError);
  v.addEventListener('loadeddata', () => { if (v.videoWidth === 0 && v.duration > 0) $('#pSwitch')?.classList.remove('hidden'); });
  $('#pBack').onclick = closePlayer;
  if ($('#pMini')) $('#pMini').onclick = miniPlayer;
  v.addEventListener('enterpictureinpicture', () => { $('#player').classList.add('mini'); if (!S.detail) document.body.classList.remove('lock'); toast('Vídeo en ventana flotante: puedes seguir navegando o cambiar de ventana.'); });
  v.addEventListener('leavepictureinpicture', () => { if (S.cur && $('#vid') === v) { $('#player').classList.remove('mini'); document.body.classList.add('lock'); } });
  try { if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: it.title + (sub ? ' · ' + sub : ''), artist: 'Mi Cine', artwork: it.p ? [{ src: posterUrl(it, 'w342'), sizes: '342x513', type: 'image/jpeg' }] : [] }); } catch {}
  $('#pSwitch').onclick = () => S.server ? srvCantPlay(true) : useIframe('Usando el reproductor de Google Drive.');
  $('#pNext').onclick = () => playNext();
  p.onpointermove = p.ontouchstart = () => { p.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => p.classList.add('idle'), 3500); };
  p.onpointermove();
  if (S.server) srvStart(resumeAt); else setSource();
  try { await (p.requestFullscreen?.() || p.webkitRequestFullscreen?.()); await screen.orientation?.lock?.('landscape'); } catch {}
  pdata().last[it.key] = file.id; saveStats();
}
function sources(id){
  if (S.server) return [`stream/${id}`];
  const list = [];
  if (navigator.serviceWorker?.controller) list.push(`./drive-stream/${id}?t=${encodeURIComponent(S.token)}`);
  list.push(`https://www.googleapis.com/drive/v3/files/${id}?alt=media&supportsAllDrives=true&access_token=${encodeURIComponent(S.token)}`);
  return list;
}
function setSource(at){
  const v = $('#vid'); if (!v) return;
  const src = sources(S.cur.file.id)[S.cur.srcIdx];
  if (!src && S.server) return srvCantPlay();
  if (!src) return useIframe('Este formato no se puede reproducir directamente en tu navegador. Uso el reproductor de Google Drive.');
  v.src = src;
  if (at) v.addEventListener('loadedmetadata', () => { v.currentTime = at; }, { once: true });
  v.play().catch(() => {});
}
function onVideoError(){
  const v = $('#vid'); if (!S.cur || !v) return;
  if (S.cur.tc) {
    if (!S.cur.started) return srvCantPlay();
    const at = vpos(v);
    pmsg(`Se ha cortado la conexión con el servidor.<br><button class="btn play">${ICON.play}Continuar</button>`, () => tcSeek(at));
    return;
  }
  if (S.cur.started && S.server) {
    const at = v.currentTime;
    pmsg(`Se ha cortado la conexión con el servidor.<br><button class="btn play">${ICON.play}Continuar</button>`, () => setSource(at));
    return;
  }
  if (S.cur.started) {
    // probablemente ha caducado la sesión a mitad de película
    const at = v.currentTime;
    pmsg(`Se ha cortado la conexión con Drive.<br><button class="btn play" id="pResume">${ICON.play}Continuar</button>`, async () => {
      try { await ensureToken(true, 50 * 60e3); } catch (e) { toast(authError(e)); return; }
      S.cur.srcIdx = 0; setSource(at);
    });
    return;
  }
  S.cur.srcIdx++; setSource();
}
function pmsg(html, onBtn){
  const p = $('#player'); p.querySelector('.pmsg')?.remove();
  const d = document.createElement('div'); d.className = 'pmsg'; d.innerHTML = html; p.appendChild(d);
  const b = d.querySelector('button'); if (b) b.onclick = () => { d.remove(); onBtn?.(); };

function useIframe(msg){
  if (!S.cur) return;
  S.cur.iframe = true;
  const v = $('#vid'); if (v) { v.pause(); v.removeAttribute('src'); v.load(); v.replaceWith(Object.assign(document.createElement('iframe'), { src: `https://drive.google.com/file/d/${S.cur.file.id}/preview`, allow: 'autoplay; fullscreen', allowFullscreen: true })); }

}
const vpos = v => S.cur?.tc ? S.cur.tc.offset + v.currentTime : v.currentTime;
const vdur = v => S.cur?.tc ? S.cur.tc.dur : v.duration;
function onTime(){
  const v = $('#vid'); const c = S.cur; if (!v || !c) return;
  if (c.tc) tcUpdate();
  const D = vdur(v), P = vpos(v);
  if (!D || !isFinite(D)) return;
  const now = Date.now();
  const frac = P / D;
  if (now - c.lastSave > 5000) {
    c.lastSave = now;
    pdata().progress[c.file.id] = { t: Math.round(P), d: Math.round(D), at: now, k: c.it.key };
    if (!c.counted && frac > 0.5) { c.counted = true; const d = pdata(); d.views[c.it.key] = (d.views[c.it.key] || 0) + 1; }
    saveStats();
  }
  const nb = $('#pNext');
  if (nb && c.it.type === 'tv') nb.classList.toggle('hidden', !(nextEp() && (D - P < 90 || frac > 0.95)));
}
function nextEp(){ const c = S.cur; if (!c?.it.eps) return null; const i = c.it.eps.findIndex(e => e.id === c.file.id); return c.it.eps[i + 1] || null; }
function onEnded(){
  const c = S.cur; if (!c) return;
  const v = $('#vid');
  const D = Math.round(vdur(v) || 0);
  pdata().progress[c.file.id] = { t: D, d: D, at: Date.now(), k: c.it.key }; saveStats();
  const n = nextEp();

async function api(path, opts = {}){
  const init = { method: opts.method || 'GET', headers: {}, credentials: 'same-origin' };
  if (opts.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
  if (opts.keepalive) init.keepalive = true;
  const r = await fetch('api/' + path, init);
  let data = null; try { data = await r.json(); } catch {}
  if (r.status === 401 && path !== 'login') { if (!$('#app').classList.contains('hidden') || !$('#who').classList.contains('hidden')) showLogin('Tu sesión ha caducado. Vuelve a entrar.'); throw new Error('Sesión caducada'); }
  if (!r.ok) throw new Error(data?.error || ('Error ' + r.status));
  return data;
}

function srvExpand(d){
  const iso = s => new Date(s * 1000).toISOString();
  const fix = it => {
    if (it.e) { it.eps = it.e.map(([id, s, e, c]) => ({ id, season: s, episode: e, c: iso(c), d: 0, th: '' })); it.seasons = [...new Set(it.eps.map(x => x.season))]; it.files = it.eps; delete it.e; }
    if (it.f) { it.files = it.f.map(([id, n, s, c]) => ({ id, n, s, c: iso(c), d: 0 })); it.main = it.files[0]; delete it.f; }
    return it;
  };
  const all = d.items.map(fix), oth = d.others.map(fix);
  S.byKey = {}; for (const it of all.concat(oth)) S.byKey[it.key] = it;
  setLib(all, oth);
  S.trending = d.trending || []; S.genres = { map: d.genres || {} };
  S.libVersion = d.version;
}
let srvLoading = false;

  if (srvLoading) return; srvLoading = true;
  try {
    if (!S.libVersion) {
      const cached = await DB.get('srvlib', null);
      if (cached) { srvExpand(cached); render(); }
    }
    if (!S.items.length && !quiet) toast('Cargando tu biblioteca…', true);
    const d = await api('library' + (S.libVersion ? '?v=' + S.libVersion : ''));
    if (!d.same) {
      const before = S.items.length;
      await DB.set('srvlib', d);
      srvExpand(JSON.parse(JSON.stringify(d)));
      render(); if (S.detail) renderDetail(true);
      const n = S.items.length - before;
      if (before && n > 0) toast(`${n} título${n > 1 ? 's' : ''} nuevo${n > 1 ? 's' : ''} en tu biblioteca`);
      else if (!quiet || loud) toast(`${S.items.length} títulos en tu biblioteca`);
    } else { if (loud) toast('Ya está todo al día'); else $('#toast').classList.add('hidden'); }
  } catch (e) { if (!String(e.message).includes('caducada')) toast('No se pudo cargar la biblioteca: ' + e.message); }
  finally { srvLoading = false; }
}

/* reproducción con audio convertido en el servidor (AC3/DTS → AAC) y barra propia */
const NO_MKV = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Safari/.test(navigator.userAgent) && !/Chrome|Chromium|Android|Edg/.test(navigator.userAgent));
async function srvStart(resumeAt){
  const c = S.cur; let pr = null;
  try { pr = await api('probe?id=' + encodeURIComponent(c.file.id) + (NO_MKV ? '&mkv=0' : '')); } catch {}
  if (S.cur !== c) return;
  if (pr && pr.transcode) {
    c.tc = { dur: pr.duration, offset: Math.max(0, Math.floor(resumeAt || 0)), audio: pr.audio_index, tracks: pr.audio, drag: false };

  }
}
const fmtT = s => { s = Math.max(0, Math.floor(s || 0)); const hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60; return (hh ? hh + ':' + String(mm).padStart(2, '0') : mm) + ':' + String(ss).padStart(2, '0'); };
function tcSetup(){
  const c = S.cur, v = $('#vid'), p = $('#player');
  v.controls = false; p.classList.add('tc');
  const bar = document.createElement('div'); bar.className = 'tcbar';
  bar.innerHTML = `<input type="range" id="tcRange" min="0" max="${Math.floor(c.tc.dur)}" step="1" value="${c.tc.offset}">
    <div class="tcrow">
      <button id="tcPlay" aria-label="Reproducir o pausar">${ICON.play}</button>
      <button id="tcBack" aria-label="Retroceder 10 segundos">−10</button>
      <button id="tcFwd" aria-label="Avanzar 30 segundos">+30</button>
      <span class="tt" id="tcTime"></span><span class="sp"></span>
      ${c.tc.tracks.length > 1 ? `<select id="tcAudio" aria-label="Pista de audio">${c.tc.tracks.map(t => `<option value="${t.index}" ${t.index === c.tc.audio ? 'selected' : ''}>${esc(t.label)}</option>`).join('')}</select>` : ''}
      ${document.pictureInPictureEnabled ? `<button id="tcMini" aria-label="Minimizar en ventana flotante" title="Minimizar"><svg class="i" viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V5c0-1.1-.9-2-2-2H3C1.9 3 1 3.9 1 5v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg></button>` : ''}
      <button id="tcFs" aria-label="Pantalla completa"><svg class="i" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7zm-2-4h2V7h3V5H5zm12 7h-3v2h5v-5h-2zM14 5v2h3v3h2V5z"/></svg></button>
    </div>`;
  p.appendChild(bar);
  const r = $('#tcRange');
  r.oninput = () => { c.tc.drag = true; $('#tcTime').textContent = fmtT(r.value) + ' / ' + fmtT(c.tc.dur); };
  r.onchange = () => { c.tc.drag = false; tcSeek(+r.value); };
  $('#tcPlay').onclick = () => v.paused ? v.play() : v.pause();
  $('#tcBack').onclick = () => tcSeek(vpos(v) - 10);
  $('#tcFwd').onclick = () => tcSeek(vpos(v) + 30);
  $('#tcFs').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : (p.requestFullscreen?.() || p.webkitRequestFullscreen?.()); } catch {} };
  if ($('#tcMini')) $('#tcMini').onclick = miniPlayer;
  if ($('#tcAudio')) $('#tcAudio').onchange = e => { c.tc.audio = +e.target.value; tcSeek(vpos(v)); };
  v.onclick = () => v.paused ? v.play() : v.pause();
  v.addEventListener('play', tcUpdate); v.addEventListener('pause', tcUpdate);
  tcUpdate();
}
function tcLoad(){ const c = S.cur, v = $('#vid'); if (!v || !c?.tc) return; v.src = `stream/${c.file.id}?a=${c.tc.audio}&start=${c.tc.offset}`; v.play().catch(() => {}); }
function tcSeek(sec){
  const c = S.cur; if (!c?.tc) return;
  c.tc.offset = Math.max(0, Math.min(Math.floor(sec), Math.floor((c.tc.dur || 1e9) - 3)));
  $('.pmsg')?.remove(); tcLoad(); tcUpdate();
}
function tcUpdate(){
  const c = S.cur, v = $('#vid'); if (!c?.tc || !v || !$('#tcRange')) return;
  if (!c.tc.drag) { $('#tcRange').value = Math.floor(vpos(v)); $('#tcTime').textContent = fmtT(vpos(v)) + ' / ' + fmtT(c.tc.dur); }
  $('#tcPlay').innerHTML = v.paused ? ICON.play : '<svg class="i" viewBox="0 0 24 24"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>';
}
document.addEventListener('keydown', e => {
  if (!S.cur?.tc || $('#player').classList.contains('hidden') || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const v = $('#vid'); if (!v) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); tcSeek(vpos(v) - 10); }
  if (e.key === 'ArrowRight') { e.preventDefault(); tcSeek(vpos(v) + 30); }
  if (e.key === ' ') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
});

function focusables(){
  const scope = !$('#menu').classList.contains('hidden') ? $('#menu') : !$('#sheet').classList.contains('hidden') ? $('#sheet') : document;
  return [...scope.querySelectorAll('button, a[href], input, select, .card, .top10 .item, .ep, .prof, .ch, .lvrow')].filter(el => {
    if (el.classList.contains('card') && el.parentElement.classList.contains('item')) return false;
    if (el.closest('.hidden') || el.disabled) return false;
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0 && getComputedStyle(el).visibility !== 'hidden' && getComputedStyle(el).opacity !== '0';
  });
}
function focusEl(el){
  if (!el) return;
  if (!el.matches('button, a[href], input, select, textarea')) el.setAttribute('tabindex', '-1');
  el.focus({ preventScroll: true });
  const sc = el.closest('.scroller');
  if (sc) { const r = el.getBoundingClientRect(), s = sc.getBoundingClientRect(); if (r.left < s.left + 20 || r.right > s.right - 20) sc.scrollBy({ left: r.left - s.left - 40, behavior: 'smooth' }); }
  const r = el.getBoundingClientRect(), top = el.closest('#sheet') ? 0 : 70;
  if (r.top < top || r.bottom > innerHeight - 10) {
    const box = el.closest('#sheet') || el.closest('#menu .menu-inner');
    if (box) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    else window.scrollBy({ top: r.top - innerHeight / 2 + r.height / 2, behavior: 'smooth' });
  }
}
function moveFocus(dx, dy){
  const els = focusables(); const cur = document.activeElement;
  if (!cur || cur === document.body || !els.includes(cur)) {
    return focusEl(els.find(el => el.getBoundingClientRect().top >= 60) || els[0]);
  }
  const c = cur.getBoundingClientRect(), cx = c.left + c.width / 2, cy = c.top + c.height / 2;
  let best = null, bestScore = Infinity;
  for (const el of els) {
    if (el === cur || el.contains(cur) || cur.contains(el)) continue;
    const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, ddx = x - cx, ddy = y - cy;
    if (dx && (Math.sign(ddx) !== dx || Math.abs(ddx) < 8)) continue;
    if (dy && (Math.sign(ddy) !== dy || Math.abs(ddy) < 8)) continue;
    if (dx && Math.abs(ddy) > Math.max(c.height, r.height)) continue; // horizontal: misma fila
    const score = dx ? Math.abs(ddx) + Math.abs(ddy) * 3 : Math.abs(ddy) + Math.abs(ddx) * 0.6;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) focusEl(best);
}
function focusKey(){
  const f = document.activeElement; if (!f || f === document.body) return null;
  const sel = f.dataset.k ? `[data-k="${CSS.escape(f.dataset.k)}"]` : f.id ? '#' + CSS.escape(f.id) : null;
  if (!sel) return null;
  const sec = f.closest('.row'); const rows = [...document.querySelectorAll('#view .row')];
  return { sel, row: sec ? rows.indexOf(sec) : -1 };
}
function restoreFocus(k){
  if (!k) return;
  const rows = [...document.querySelectorAll('#view .row')];
  const el = (k.row >= 0 && rows[k.row]?.querySelector(k.sel)) || document.querySelector('#view ' + k.sel);
  if (el) focusEl(el);
}
if (TV) document.addEventListener('keydown', e => {
  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const t = e.target;
  if (dirs[e.key]) {
    if ((t.tagName === 'INPUT' && t.type !== 'checkbox' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) || t.tagName === 'SELECT') return;
    e.preventDefault(); moveFocus(...dirs[e.key]);
  } else if ((e.key === 'Enter' || e.key === ' ') && t !== document.body && !t.matches('button, a[href], input, select, textarea')) {
    e.preventDefault(); t.click();
  }
});

  return `<div class="lvrow ${LV.sel === c.id ? 'on' : ''}" data-lsel="${c.id}" role="button" tabindex="0">
    <div class="lg">${logoHtml(c)}</div>
    <div class="inf"><b>${esc(c.name)}</b><span class="np">${c.now ? esc(c.now.t) : '<i>Sin guía</i>'}</span>${c.now ? `<div class="prog"><i style="width:${chPct(c.now)}%"></i></div>` : ''}</div>
    <button class="fav ${fav ? 'on' : ''}" data-fav="${c.id}" aria-label="Favorito">${fav ? '★' : '☆'}</button>
    <button class="pl" data-live="${c.id}" aria-label="Ver ${esc(c.name)}">${ICON.play}</button></div>`;
}
function channelsHtml(){
  const list = chList();
  if (!LV.sel || !list.some(c => c.id === LV.sel)) LV.sel = (list[0] || liveData.channels[0]).id;
  return `<div class="lv">
    <div class="lvprev" id="lvPrev">${prevHtml()}</div>
    <div class="lvside">
      <div class="lvsearch"><svg class="i" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="lvQ" type="search" placeholder="Buscar canal…" value="${esc(LV.q)}" autocomplete="off"></div>
      ${groupChips()}
      <div class="lvlist" id="lvList">${listInner(list)}</div>
    </div></div>`;
}
function listInner(list){ return list.length ? list.map(rowHtml).join('') : '<div class="empty">Ningún canal coincide.</div>'; }
function upHtml(id){
  const c = liveData.channels.find(x => x.id === id); if (!c) return '<div class="pvup"></div>';
  const now = Date.now() / 1000;
  let up = (epgData?.by[id]?.p || []).filter(p => p[0] > now).slice(0, 4);
  if (!up.length && c.next) up = [[c.next.s, 0, c.next.t]];
  return `<div class="pvup">${up.length ? '<h3>A continuación</h3>' + up.map(p => `<div><b>${hm(p[0])}</b><span>${esc(p[2])}</span></div>`).join('') : ''}</div>`;
}
function prevHtml(){
  const c = liveData.channels.find(x => x.id === LV.sel); if (!c) return '';
  const pv = LS.get('livePv', true), fav = liveFavs().includes(c.id);
  return `<div class="pvbox">
      <div class="pvlogo">${logoHtml(c)}</div>
      <video id="pvVid" muted playsinline autoplay disablepictureinpicture></video>
      <div class="pvmsg" id="pvMsg">${pv ? '' : 'Vista previa desactivada'}</div>
    </div>
    <div class="pvov">
      <div class="pvtag"><span class="badge-live">EN VIVO</span><span class="grp">${esc(c.group || '')}</span></div>
      <h2>${esc(c.name)}</h2>
      ${c.now ? `<div class="pvnow"><span>${esc(c.now.t)}</span><small>${hm(c.now.s)} – ${hm(c.now.e)}</small></div><div class="prog"><i style="width:${chPct(c.now)}%"></i></div>` : '<div class="pvnow"><small>Sin información de programación</small></div>'}
      <div class="pvbtns"><button class="btn play" data-live="${c.id}">${ICON.play}Ver ahora</button><button class="btn sec ${fav ? 'on' : ''}" data-fav="${c.id}">${fav ? '★ En favoritos' : '☆ Favorito'}</button><button class="btn sec" id="pvToggle" title="La vista previa usa una conexión mientras miras la lista">Vista previa: ${pv ? 'sí' : 'no'}</button></div>
      ${upHtml(c.id)}
    </div>`;
}
function bindChannels(){
  const q = $('#lvQ');
  if (q) q.oninput = () => { LV.q = q.value; $('#lvList').innerHTML = listInner(chList()); };
  bindPrev();
}
function bindPrev(){
  const t = $('#pvToggle');
  if (t) t.onclick = () => { const on = !LS.get('livePv', true); LS.set('livePv', on); t.textContent = 'Vista previa: ' + (on ? 'sí' : 'no'); $('#pvMsg').textContent = on ? '' : 'Vista previa desactivada'; if (on) startPreview(); else stopPreview(); };
}
function stopPreview(){
  clearTimeout(LV.pvTimer);
  const v = $('#pvVid');
  if (v && v.getAttribute('src')) { v.onerror = null; v.pause(); v.removeAttribute('src'); v.load(); }
  v?.closest('.pvbox')?.classList.remove('playing');
}
function startPreview(){
  clearTimeout(LV.pvTimer);
  if (!LS.get('livePv', true) || !S.server) return;
  const id = LV.sel;
  LV.pvTimer = setTimeout(() => {
    const v = $('#pvVid');
    if (!v || LV.sel !== id || document.hidden || !$('#player').classList.contains('hidden') || S.tab !== 'live') return;
    const box = v.closest('.pvbox');
    $('#pvMsg').innerHTML = '<div class="spin"></div>';
    v.onplaying = () => { box.classList.add('playing'); $('#pvMsg').textContent = ''; };
    v.onerror = () => { box.classList.remove('playing'); if (LV.sel === id) $('#pvMsg').textContent = 'Vista previa no disponible ahora mismo'; };
    v.src = `live/${id}?pv=1`; v.play().catch(() => {});
  }, 900);
}
function selectChannel(id){
  if (LV.sel === id && $('#pvVid')) return;
  stopPreview();
  LV.sel = id;
  for (const r of document.querySelectorAll('.lvrow')) r.classList.toggle('on', r.dataset.lsel === id);
  const pv = $('#lvPrev'); if (!pv) return;
  pv.innerHTML = prevHtml(); bindPrev(); startPreview();
  if (innerWidth < 900 && !TV) pv.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
document.addEventListener('visibilitychange', () => { if (document.hidden) stopPreview(); else if (S.tab === 'live' && $('#pvVid')) startPreview(); });

/* ---- Guía de programación en rejilla ---- */
const GPX = () => innerWidth < 700 ? 3.4 : 4.6;     // píxeles por minuto
const CHW = () => innerWidth < 700 ? 104 : 200;     // ancho de la columna de canales
function guideHtml(){
  const days = [0, 1, 2].map(o => {
    const d = new Date(dayStart(o) * 1000);
    return `<button class="gday ${epgDay === o ? 'on' : ''}" data-gday="${o}"><small>${o === 0 ? 'HOY' : o === 1 ? 'MAÑANA' : d.toLocaleDateString('es-ES', { weekday: 'short' }).replace('.', '').toUpperCase()}</small><b>${d.getDate()}</b></button>`;
  }).join('');
  return `<div class="gtop"><div class="gdays">${days}${epgDay === 0 ? '<button class="gday gnowb" id="gNow"><small>IR A</small><b>Ahora</b></button>' : ''}</div>
      <div class="gdet" id="gDet"><div class="ghint">${TV ? 'Mueve el foco por la guía para ver el detalle de cada programa.' : 'Toca un programa para ver el detalle · toca el canal para verlo.'}</div></div></div>
    ${groupChips()}
    <div class="gwrap" id="gWrap"><div class="spin" style="margin:30px auto"></div></div>`;
}
function paintGuide(){
  const w = $('#gWrap'); if (!w || !epgData) return;
  if (epgData.from !== dayStart(epgDay)) { loadEpg(epgDay).then(paintGuide).catch(() => {}); return; }
  const px = GPX(), cw = CHW(), from = epgData.from, to = epgData.to, W = Math.round((to - from) / 60 * px);
  const ticks = [];
  for (let t = from; t < to; t += 1800) ticks.push(`<span style="left:${(t - from) / 60 * px}px">${hm(t)}</span>`);
  const now = Date.now() / 1000;
  LV.rows = chList(); LV.n = 0;
  w.innerHTML = `<div class="gscroll" id="gScroll" style="--chw:${cw}px"><div class="ginner" style="width:${W + cw}px">
      <div class="ghead"><div class="gcorner">${epgData.channels.some(c => c.p.length) ? '' : '<small>Sin guía</small>'}</div><div class="gticks" style="width:${W}px">${ticks.join('')}${now > from && now < to ? `<i class="gnowlbl" id="gLbl" style="left:${(now - from) / 60 * px}px">${hm(now)}</i>` : ''}</div></div>
      <div id="gRows"></div>
      ${now > from && now < to ? `<div class="gnowline" id="gLine" style="left:${cw + (now - from) / 60 * px}px"></div>` : ''}
    </div></div>`;
  if (!LV.rows.length) { $('#gRows').innerHTML = '<div class="empty" style="position:sticky;left:0;width:min(100vw,600px)">Ningún canal en esta categoría.</div>'; }
  moreRows();
  const sc = $('#gScroll');
  const fit = () => { const top = sc.getBoundingClientRect().top + scrollY, nav = $('#bottomNav')?.offsetHeight || 0; sc.style.height = Math.max(320, innerHeight * 0.6, innerHeight - Math.max(0, top - scrollY) - nav - 6) + 'px'; };
  fit();
  sc.scrollLeft = epgDay === 0 ? Math.max(0, (now - from) / 60 * px - 90) : 20 * 60 * px - 40;
  sc.onscroll = () => { if (sc.scrollTop + sc.clientHeight > sc.scrollHeight - 600) moreRows(); };
  if ($('#gNow')) $('#gNow').onclick = () => sc.scrollTo({ left: Math.max(0, (Date.now() / 1000 - from) / 60 * px - 90), behavior: 'smooth' });
}
function moreRows(){
  const box = $('#gRows'); if (!box || LV.n >= LV.rows.length) return;
  const chunk = LV.rows.slice(LV.n, LV.n + 40); LV.n += chunk.length;
  box.insertAdjacentHTML('beforeend', chunk.map(gRowHtml).join(''));
}
function gRowHtml(c){
  const px = GPX(), from = epgData.from, to = epgData.to, now = Date.now() / 1000;
  const ps = epgData.by[c.id]?.p || [];
  let blocks;
  if (ps.length) {
    blocks = ps.map(p => {
      const s = Math.max(p[0], from), e = Math.min(p[1], to);
      const st = p[1] <= now ? 'past' : p[0] <= now ? 'cur' : '';
      return `<button class="gp ${st} ${LV.gsel === c.id + '|' + p[0] ? 'sel' : ''}" style="left:${(s - from) / 60 * px}px;width:${Math.max(4, (e - s) / 60 * px - 4)}px" data-gp="${c.id}|${p[0]}"><span><b>${esc(p[2])}</b><small>${hm(p[0])}–${hm(p[1])}</small></span></button>`;
    }).join('');
  } else {
    blocks = '';
    for (let t = from; t < to; t += 3 * 3600) blocks += `<button class="gp none" style="left:${(t - from) / 60 * px}px;width:${3 * 60 * px - 4}px" data-live="${c.id}"><span><b>${esc(c.name)}</b><small>Sin información · toca para verlo</small></span></button>`;
  }
  return `<div class="grow"><button class="gch" data-live="${c.id}" title="Ver ${esc(c.name)}"><span class="lg">${logoHtml(c)}</span><span class="nm">${esc(c.name)}</span></button><div class="gtrack">${blocks}</div></div>`;
}
const descCache = {};
async function showProg(cid, s){
  const c = liveData.channels.find(x => x.id === cid), p = epgData?.by[cid]?.p.find(x => x[0] === +s);
  if (!c || !p) return;
  const key = cid + '|' + p[0]; LV.gsel = key;
  for (const x of document.querySelectorAll('.gp.sel')) x.classList.remove('sel');
  document.querySelector(`.gp[data-gp="${key}"]`)?.classList.add('sel');
  const now = Date.now() / 1000, live = p[0] <= now && now < p[1];
  const paint = d => { const box = $('#gDet'); if (!box || LV.gsel !== key) return; box.innerHTML = `
    <div class="gdl"><span class="lg">${logoHtml(c)}</span></div>
    <div class="gdr"><div class="gdm">${live ? '<span class="badge-live">EN EMISIÓN</span>' : ''}<span>${esc(c.name)} · ${dayLabel(p[0])}, ${hm(p[0])} – ${hm(p[1])}${p[3] ? ' · ' + esc(p[3]) : ''}</span></div>
      <h3>${esc(p[2])}</h3>${live ? `<div class="prog"><i style="width:${chPct({ s: p[0], e: p[1] })}%"></i></div>` : ''}
      <p>${d === undefined ? '<span class="small">Cargando…</span>' : d ? esc(d) : '<span class="small">Sin descripción.</span>'}</p></div>
    ${live ? `<button class="btn play" data-live="${cid}">${ICON.play}Ver ahora</button>` : ''}`; };
  paint(descCache[key]);
  if (descCache[key] === undefined) {
    try { descCache[key] = (await api(`epg/info?id=${cid}&s=${p[0]}`)).d || ''; } catch { descCache[key] = ''; }
    paint(descCache[key]);
  }
}
function onGuideClick(gp){
  const [cid, s] = gp.dataset.gp.split('|');
  if (LV.gsel === gp.dataset.gp && gp.classList.contains('cur')) return playLive(cid);
  showProg(cid, s);
}
document.addEventListener('focusin', e => {
  if (!TV || S.tab !== 'live') return;
  const r = e.target.closest?.('.lvrow'); if (r) { clearTimeout(LV.fTimer); LV.fTimer = setTimeout(() => selectChannel(r.dataset.lsel), 450); return; }
  const g = e.target.closest?.('.gp[data-gp]'); if (g) { const [cid, s] = g.dataset.gp.split('|'); showProg(cid, s); scrollGuideTo(g); }
});
function scrollGuideTo(el){
  const sc = $('#gScroll'); if (!sc) return;
  const r = el.getBoundingClientRect(), b = sc.getBoundingClientRect(), cw = CHW();
  if (r.left < b.left + cw) sc.scrollBy({ left: r.left - b.left - cw - 20 });
  else if (r.left > b.right - 120) sc.scrollBy({ left: r.left - b.right + Math.min(r.width, 400) + 20 });
  if (r.top < b.top + 40 || r.bottom > b.bottom) sc.scrollBy({ top: r.top - b.top - b.height / 2 });
}
setInterval(async () => {
  if (S.tab !== 'live' || !$('#liveBox') || document.hidden) return;
  const ln = $('#gLine');
  if (ln && epgData) { const now = Date.now() / 1000, x = (now - epgData.from) / 60 * GPX(); ln.style.left = CHW() + x + 'px'; const lb = $('#gLbl'); if (lb) { lb.style.left = x + 'px'; lb.textContent = hm(now); } }
  if ($('#lvList')) {
    try { await loadLive(); } catch { return; }
    for (const r of document.querySelectorAll('.lvrow')) {
      const c = liveData.channels.find(x => x.id === r.dataset.lsel); if (!c?.now) continue;
      r.querySelector('.np').textContent = c.now.t;
      const i = r.querySelector('.prog i'); if (i) i.style.width = chPct(c.now) + '%';
    }
  }
}, 60e3);

async function playLive(id){
  const ch = liveData?.channels.find(c => c.id === id); if (!ch) return;
  stopHeroTrailer(); stopPreview();
  try { const a = await api('live/avail?id=' + id); if (!a.free) { toast('Todas las conexiones de este canal están ocupadas. Prueba en un rato.'); return; } } catch {}
  let tok = LS.get('srvToken', '');
  if (!tok) { try { tok = (await api('token')).token; LS.set('srvToken', tok); } catch {} }
  const tsUrl = new URL(`live/${id}.ts?t=${encodeURIComponent(tok)}`, location.href).href;
  if (window.MiCineAndroid) { MiCineAndroid.play(JSON.stringify({ url: tsUrl, title: ch.name, subtitle: ch.now ? ch.now.t : 'En directo', start: 0, fileId: 'live', key: 'live', hasNext: false, live: true })); return; }
  // iPhone/iPad y Android sin la app: el canal se abre en VLC (o en otro reproductor en Android)
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS) {
    toast('Abriendo «' + ch.name + '» en VLC… Si no se abre, instala VLC desde la App Store.');
    location.href = 'vlc-x-callback://x-callback-url/stream?url=' + encodeURIComponent(tsUrl);
    return;
  }
  if (/Android/i.test(ua)) {
    location.href = `intent:${tsUrl}#Intent;action=android.intent.action.VIEW;type=video/*;S.title=${encodeURIComponent(ch.name)};end`;
    return;
  }
  const p = $('#player');
  S.cur = { live: true, liveId: id, it: { title: ch.name, key: 'live' }, file: { id: 'live' }, started: false };
  p.innerHTML = `<div class="pbar livebar"><button class="hbtn" id="pBack" aria-label="Volver a los canales">${ICON.back}</button><span class="badge-live">EN VIVO</span><div class="ttl">${esc(ch.name)}<small>${ch.now ? esc(ch.now.t) : ''}</small></div></div>
    <video id="vid" controls autoplay playsinline></video>`;
  if (p.classList.contains('hidden')) pushH('p');
  p.classList.remove('hidden', 'mini'); document.body.classList.add('lock');
  const v = $('#vid');
  v.addEventListener('playing', () => { if (S.cur) S.cur.started = true; });
  v.addEventListener('error', () => pmsg(`No se puede reproducir este canal en el navegador.<br><small class="small">En la app de Android se ven más canales.</small><br><button class="btn sec">Cerrar</button>`, closePlayer));
  v.src = `live/${id}`; v.play().catch(() => {});
  $('#pBack').onclick = closePlayer;
  // En directo la barra con «volver» se queda siempre visible (en tablet no hay otra forma fácil de salir)
  clearTimeout(idleTimer); p.classList.remove('idle'); p.onpointermove = p.ontouchstart = null;
  try { p.requestFullscreen?.(); } catch {}
}

/* =========================================================
   Peticiones
   ========================================================= */
const ST_LABEL = { 'pendiente': '⏳ Pendiente', 'en camino': '🚚 En camino', 'disponible': '✅ Disponible', 'rechazada': '❌ Rechazada' };
function requestsHtml(){
  return `<h1 class="section-title">Peticiones</h1>
    <p class="small" style="padding:0 16px;margin:4px 0 0">¿Echas algo en falta? Búscalo y pídelo. ${S.user?.admin ? 'Aquí ves las peticiones de todos.' : 'Aquí verás cómo va tu petición.'}</p>
    <div class="searchbox" style="position:static;padding-top:10px"><div><svg class="i" viewBox="0 0 24 24" style="color:#999"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="rq" type="search" placeholder="Busca una película o serie…" autocomplete="off"></div></div>
    <div id="rqRes"></div>
    <section class="row"><h2>${S.user?.admin ? 'Todas las peticiones' : 'Mis peticiones'}</h2></section>
    <div id="rqList"><div class="spin" style="margin:20px auto"></div></div>`;
}
let rqTimer = null;
function bindRequests(){
  const i = $('#rq');
  i.oninput = () => { clearTimeout(rqTimer); rqTimer = setTimeout(searchRequests, 450); };
  i.onkeydown = e => { if (e.key === 'Enter') { clearTimeout(rqTimer); searchRequests(); } };
  loadRequests();
}
async function searchRequests(){
  const q = $('#rq')?.value.trim(), box = $('#rqRes'); if (!box) return;
  if (!q || q.length < 2) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="spin" style="margin:16px auto"></div>';
  try {
    const r = await api('search?q=' + encodeURIComponent(q));
    box.innerHTML = r.results.length ? r.results.map(x => `<div class="rqrow">
      ${x.p ? `<img src="${IMG}w154${x.p}" alt="" loading="lazy">` : '<div class="noimg"></div>'}
      <div class="tx"><b>${esc(x.t)}</b><span class="small">${x.y || '—'} · ${x.type === 'tv' ? 'Serie' : 'Película'}</span><div class="small" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(x.o)}</div></div>
      <div class="acts">${x.have && S.byKey[x.key] ? `<button class="mini ok" data-k="${esc(x.key)}">Ver ahora</button>` : x.req ? `<span class="st ${x.req.replace(' ', '')}">${ST_LABEL[x.req] || x.req}</span>` : `<button class="mini ok" data-rqadd='${esc(JSON.stringify({ type: x.type, id: x.id, title: x.t, year: x.y, poster: x.p }))}'>Pedir</button>`}</div></div>`).join('')
      : '<div class="empty">Sin resultados.</div>';
    box.querySelectorAll('[data-rqadd]').forEach(b => b.onclick = async () => {
      try { const res = await api('requests', { method: 'POST', body: JSON.parse(b.dataset.rqadd) }); b.outerHTML = `<span class="st pendiente">${res.already ? 'Ya estaba pedida' : '⏳ Pedida'}</span>`; loadRequests(); }
      catch (e) { toast(e.message); }
    });
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function loadRequests(){
  const box = $('#rqList'); if (!box) return;
  let r; try { r = await api('requests'); } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (!r.requests.length) { box.innerHTML = '<div class="empty">Todavía no hay peticiones.</div>'; return; }
  box.innerHTML = r.requests.map(x => {
    const key = x.type + ':' + x.tmdb_id;
    const mine = x.user_id === S.user?.id;
    return `<div class="rqrow" data-rid="${x.id}">
      ${x.poster ? `<img src="${IMG}w154${x.poster}" alt="" loading="lazy">` : '<div class="noimg"></div>'}
      <div class="tx"><b>${esc(x.title)}</b><span class="small">${x.year || ''} · ${x.type === 'tv' ? 'Serie' : 'Película'}${S.user?.admin ? ' · pedida por ' + esc(x.username) : ''} · ${new Date(x.created * 1000).toLocaleDateString('es-ES')}</span><br><span class="st ${x.status.replace(' ', '')}">${ST_LABEL[x.status] || x.status}</span></div>
      <div class="acts">
        ${x.status === 'disponible' && S.byKey[key] ? `<button class="mini ok" data-k="${esc(key)}">Ver ahora</button>` : ''}
        ${S.user?.admin ? `${x.status !== 'en camino' && x.status !== 'disponible' ? `<button class="mini" data-rst="en camino">En camino</button>` : ''}${x.status !== 'disponible' ? `<button class="mini ok" data-rst="disponible">Conseguida</button>` : ''}${x.status !== 'rechazada' && x.status !== 'disponible' ? `<button class="mini" data-rst="rechazada">Rechazar</button>` : ''}<button class="mini danger" data-rdel>Borrar</button>`
          : mine && x.status === 'pendiente' ? `<button class="mini" data-rdel>Cancelar</button>` : ''}
      </div></div>`;
  }).join('');
  box.querySelectorAll('[data-rst]').forEach(b => b.onclick = async () => { try { await api('requests/' + b.closest('[data-rid]').dataset.rid, { method: 'POST', body: { status: b.dataset.rst } }); loadRequests(); } catch (e) { toast(e.message); } });
  box.querySelectorAll('[data-rdel]').forEach(b => b.onclick = async () => { try { await api('requests/' + b.closest('[data-rid]').dataset.rid, { method: 'DELETE' }); loadRequests(); } catch (e) { toast(e.message); } });
}

boot();
</script>
