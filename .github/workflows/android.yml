name: App Android
on:
  push:
    paths: ['android-app.zip', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Preparar
        run: |
          unzip -q android-app.zip -d src
          if [ ! -f micine.keystore ]; then
            keytool -genkeypair -keystore micine.keystore -storepass micine123 -keypass micine123 -alias micine -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mi Cine"
            git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
            git add micine.keystore; git commit -m "Clave de firma de la app"; git push
          fi
          cp micine.keystore src/android/app/micine.keystore
      - name: Compilar
        working-directory: src/android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../../build.log
          cp app/build/outputs/apk/release/app-release.apk ../../MiCine.apk
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: App Mi Cine (Android y Android TV)
          body: Descarga MiCine.apk e instálalo en tu móvil o Android TV. Compilación ${{ github.run_number }}.
          files: MiCine.apk
          make_latest: true
      - name: Resultado
        if: always()
        run: |
          cp build.log /tmp/b.log 2>/dev/null || echo "sin registro" > /tmp/b.log
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git checkout -q --orphan build-log; git rm -rfq . || true
          echo "estado: ${{ job.status }} (compilación ${{ github.run_number }})" > status.txt
          tail -n 400 /tmp/b.log > build.log
          git add status.txt build.log; git commit -qm "Compilación ${{ github.run_number }}: ${{ job.status }}"
          git push -qf origin build-log
