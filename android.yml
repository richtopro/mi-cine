name: App Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Clave de firma (se crea solo la primera vez)
        run: |
          if [ ! -f android/app/micine.keystore ]; then
            keytool -genkeypair -keystore android/app/micine.keystore -storepass micine123 -keypass micine123 \
              -alias micine -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mi Cine"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add android/app/micine.keystore
            git commit -m "Clave de firma de la app"
            git push
          fi

      - name: Compilar la app
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
          cp app/build/outputs/apk/release/app-release.apk ../MiCine.apk

      - name: Publicar la app (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: App Mi Cine (Android y Android TV)
          body: |
            Descarga **MiCine.apk** e instálalo en tu móvil o en tu Android TV.
            Compilación nº ${{ github.run_number }}.
          files: MiCine.apk
          make_latest: true

      - name: Guardar el resultado (para diagnóstico)
        if: always()
        run: |
          STATUS="${{ job.status }}"
          cp build.log /tmp/build.log 2>/dev/null || echo "sin registro" > /tmp/build.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rfq . || true
          { echo "estado: $STATUS"; echo "compilacion: ${{ github.run_number }}"; date -u; } > status.txt
          tail -n 400 /tmp/build.log > build.log
          git add status.txt build.log
          git commit -qm "Resultado de la compilación ${{ github.run_number }}: $STATUS"
          git push -f origin build-log
